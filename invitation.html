const SAYTXT = () => (T[L].say[WHO] || T[L].say.Guest);

/* ---------- voice: Google online voice first (works everywhere), browser voice as backup ---------- */
let curA = null, speaking = false;
function stopVoice(){ try { speechSynthesis.cancel(); } catch(e) {} if (curA) { try { curA.onended = curA.onerror = null; curA.pause(); } catch(e) {} curA = null; } speaking = false; $('host').classList.remove('talk'); }
function chunks(s){ const p = s.replace(/([।.!?,])\s+/g, '$1\u0001').split('\u0001'), o = []; let c = '';
  p.forEach(x => { if ((c + ' ' + x).trim().length > 170 && c) { o.push(c.trim()); c = x; } else c = (c + ' ' + x).trim(); }); if (c) o.push(c); return o; }
function voiceFor(lang){ let vs = []; try { vs = speechSynthesis.getVoices(); } catch(e) {}
  const want = { en:/^en[-_]IN/i, hi:/^hi/i, as:/^(as|bn)/i }[lang]; const F = /neerja|swara|tanishaa|yashica|heera|kalpana|female|zira|google/i, M = /ravi|prabhat|madhur|hemant|bashkar|david|mark|\bmale\b/i;
  return vs.filter(v => want.test(v.lang) || (lang === 'en' && /^en/i.test(v.lang))).sort((a, b) => ((/natural|online/i.test(b.name) ? 20 : 0) + (F.test(b.name) ? 10 : 0) - (M.test(b.name) && !/female/i.test(b.name) ? 40 : 0) + (want.test(b.lang) ? 5 : 0)) - ((/natural|online/i.test(a.name) ? 20 : 0) + (F.test(a.name) ? 10 : 0) - (M.test(a.name) && !/female/i.test(a.name) ? 40 : 0) + (want.test(a.lang) ? 5 : 0)))[0] || null; }
function speak(text){
  stopVoice(); const spans = [...$('say').querySelectorAll('.w')]; let wi = 0; const rv = n => { for (; wi < Math.min(n, spans.length); wi++) spans[wi].classList.add('s'); };
  spans.forEach(s => s.classList.remove('s')); let tm = setInterval(() => rv(wi + 1), 320);
  const fin = () => { clearInterval(tm); rv(spans.length); speaking = false; $('host').classList.remove('talk'); };
  const start = () => { speaking = true; $('host').classList.add('talk'); };
  const say = text.replace(/KAVYA/g, 'Kavya').replace(/\bAPS\b/g, 'A P S').replace(/\bVIPs?\b/g, 'V I P').replace(/2027-28/g, '2027 to 28').replace(/২০২৭-২৮/g, '২০২৭ৰ পৰা ২৮');
  const code = { en:'en-IN', hi:'hi', as:'bn' }[L]; let tx = L === 'as' ? say.replace(/ৰ/g, 'র').replace(/ৱ/g, 'ও') : say;
  const parts = chunks(tx); let i = 0, ok = false; const a = new Audio(); curA = a;
  const url = s => 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=' + code + '&q=' + encodeURIComponent(s);
  const browser = () => { if (curA !== a) return; curA = null; try { const v = voiceFor(L), u = new SpeechSynthesisUtterance(tx); if (v) { u.voice = v; u.lang = v.lang; } u.pitch = v && /natural|online/i.test(v.name) ? 1 : 1.08; u.rate = .97;
      u.onstart = start; u.onend = u.onerror = fin; speechSynthesis.speak(u); } catch(e) { fin(); } };
  a.onplaying = () => { ok = true; start(); }; a.onended = () => { i++; if (i < parts.length) { a.src = url(parts[i]); a.play().catch(fin); } else fin(); };
  a.onerror = () => { if (!ok) browser(); else fin(); }; setTimeout(() => { if (!ok && curA === a) { a.pause(); browser(); } }, 5000);
  a.src = url(parts[0]); a.play().catch(() => browser());
}
